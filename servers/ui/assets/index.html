<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TsunamiDB Studio</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <header class="top-bar">
        <div class="brand">
            <span class="brand-title">TsunamiDB Studio</span>
            <span class="brand-subtitle">Administration Console</span>
        </div>
        <div class="top-actions">
            <button id="refresh-health" class="primary">Refresh Status</button>
            <span id="health-updated" class="muted"></span>
        </div>
    </header>
    <main class="layout">
        <aside class="object-explorer">
            <div class="explorer-header">
                <span>Object Explorer</span>
                <button id="refresh-objects" class="icon-button" title="Reload">&#8635;</button>
            </div>
            <div class="explorer-body" id="object-tree">
                <div class="tree-group">
                    <button class="tree-toggle is-open" data-target="tree-tables">Tables</button>
                    <ul id="tree-tables" class="tree-list"></ul>
                </div>
                <div class="tree-group">
                    <button class="tree-toggle" data-target="tree-inc">Incremental Descriptors</button>
                    <ul id="tree-inc" class="tree-list is-collapsed"></ul>
                </div>
            </div>
        </aside>
        <section class="workspace">
            <div class="query-pane">
                <div class="query-toolbar">
                    <div class="query-controls">
                        <label class="field">
                            <span>Operation</span>
                            <select id="operation-select">
                                <option value="read-key">Read key</option>
                                <option value="list-entries">List entries</option>
                                <option value="search-regex">Search by regex</option>
                                <option value="read-inc">Read incremental</option>
                            </select>
                        </label>
                        <div id="operation-fields" class="fields-grid"></div>
                    </div>
                    <div class="query-actions">
                        <button id="run-operation" class="primary">Run</button>
                        <span id="operation-status" class="muted"></span>
                    </div>
                </div>
                <div class="query-preview">
                    <label for="operation-preview">Command Preview</label>
                    <textarea id="operation-preview" readonly spellcheck="false"></textarea>
                </div>
            </div>
            <div class="result-pane">
                <div class="tab-bar">
                    <button class="tab is-active" data-tab="results">Results</button>
                    <button class="tab" data-tab="messages">Messages</button>
                </div>
                <div class="tab-content is-active" data-tab="results">
                    <div id="results-output" class="results-body muted">Select an operation and press Run.</div>
                </div>
                <div class="tab-content" data-tab="messages">
                    <div id="messages-output" class="results-body"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="/assets/app.js"></script>
</body>
</html>
